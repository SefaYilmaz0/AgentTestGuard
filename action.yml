name: "TestGuard Anti-Cheat Gate"
description: "The Zero-Trust Anti-Cheat Gate for AI-Generated Code. Prevents test skipping, assertion dropping, and hardcoding."
author: "Sefa Yılmaz"
branding:
  icon: "shield"
  color: "green"

inputs:
  base:
    description: "Base git ref or branch to compare against"
    required: false
    default: "origin/main"
  format:
    description: "Output format (text, json, markdown)"
    required: false
    default: "markdown"
  cwd:
    description: "Working directory"
    required: false
    default: "."
  config:
    description: "Path to configuration file (.testguard.json or pyproject.toml)"
    required: false
    default: ""

  shadow-run:
    description: "Also run the base branch's tests against the modified sources (true/false)"
    required: false
    default: "false"

outputs:
  verdict:
    description: "Verdict result: PASS, VETO or ERROR"
    value: ${{ steps.testguard-run.outputs.verdict }}
  violations-count:
    description: "Number of cheating violations detected"
    value: ${{ steps.testguard-run.outputs.violations_count }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install TestGuard
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        python -m pip install --upgrade pip
        python -m pip install "$ACTION_PATH"

    - name: Run TestGuard Verification
      id: testguard-run
      shell: bash
      env:
        TG_BASE: ${{ inputs.base }}
        TG_FORMAT: ${{ inputs.format }}
        TG_CWD: ${{ inputs.cwd }}
        TG_CONFIG: ${{ inputs.config }}
        TG_SHADOW: ${{ inputs.shadow-run }}
      run: |
        # Inputs are passed via env vars (never interpolated into the script)
        # to prevent shell injection from untrusted values.
        cd "$TG_CWD"

        # Make sure the base ref exists locally; fail closed if it cannot be resolved.
        if ! git rev-parse --verify --quiet "${TG_BASE}^{commit}" >/dev/null; then
          BRANCH="${TG_BASE#origin/}"
          git fetch --no-tags origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" || true
        fi
        # Bare branch names (e.g. github.base_ref = "main") resolve via origin/.
        if ! git rev-parse --verify --quiet "${TG_BASE}^{commit}" >/dev/null \
           && git rev-parse --verify --quiet "origin/${TG_BASE}^{commit}" >/dev/null; then
          TG_BASE="origin/${TG_BASE}"
        fi
        if ! git rev-parse --verify --quiet "${TG_BASE}^{commit}" >/dev/null; then
          echo "verdict=ERROR" >> "$GITHUB_OUTPUT"
          echo "violations_count=0" >> "$GITHUB_OUTPUT"
          echo "### ⚠️ TestGuard Error" >> "$GITHUB_STEP_SUMMARY"
          echo "Base ref \`$TG_BASE\` could not be resolved. Use \`fetch-depth: 0\` in actions/checkout or pass a valid \`base\` input." >> "$GITHUB_STEP_SUMMARY"
          echo "::error::TestGuard could not resolve base ref '$TG_BASE'"
          exit 2
        fi

        ARGS=(--base "$TG_BASE" --cwd .)
        if [ -n "$TG_CONFIG" ]; then
          ARGS+=(--config "$TG_CONFIG")
        fi

        if [ "$TG_SHADOW" = "true" ]; then
          ARGS+=(--shadow-run)
        fi

        set +e
        OUTPUT=$(testguard check "${ARGS[@]}" --format "$TG_FORMAT")
        EXIT_CODE=$?
        COUNT=$(testguard check "${ARGS[@]}" --format json 2>/dev/null | python -c 'import json,sys; print(len(json.load(sys.stdin)["violations"]))')
        set -e
        COUNT=${COUNT:-0}

        echo "$OUTPUT"

        if [ $EXIT_CODE -eq 0 ]; then
          echo "verdict=PASS" >> "$GITHUB_OUTPUT"
          echo "violations_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "### 🛡️ TestGuard Verification Passed" >> "$GITHUB_STEP_SUMMARY"
          echo "$OUTPUT" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        elif [ $EXIT_CODE -eq 1 ]; then
          echo "verdict=VETO" >> "$GITHUB_OUTPUT"
          echo "violations_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "### 🚨 TestGuard Verification Failed (VETO)" >> "$GITHUB_STEP_SUMMARY"
          echo "$OUTPUT" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        else
          echo "verdict=ERROR" >> "$GITHUB_OUTPUT"
          echo "violations_count=0" >> "$GITHUB_OUTPUT"
          echo "### ⚠️ TestGuard Error (exit $EXIT_CODE)" >> "$GITHUB_STEP_SUMMARY"
          exit "$EXIT_CODE"
        fi
